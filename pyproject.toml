[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-rocket"
version = "1.0.0"
description = "Polished Tkinter ASCII survival arcade game"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[project.scripts]
ascii-rocket = "ascii_rocket.__main__:main"

[tool.setuptools.packages.find]
include = ["ascii_rocket*"]

